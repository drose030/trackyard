name: Desktop app

# A version tag (v0.2.0) builds the installers and attaches them to that tag's GitHub
# release. "Run workflow" builds them without a release, kept for a few days to test.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15  # Apple Silicon
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"

      - name: Build the DMG
        working-directory: desktop
        run: |
          npm ci
          npm run dist

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Trackyard $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" desktop/dist/*.dmg --clobber

      - name: Keep a test build
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: trackyard-mac
          path: desktop/dist/*.dmg
          retention-days: 3
