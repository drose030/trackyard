name: Desktop app

# A version tag (v0.2.0) builds the installers and attaches them to that tag's GitHub
# release. "Run workflow" builds them without a release, kept for a few days to test.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15  # Apple Silicon
            name: mac
            files: desktop/dist/*.dmg
          - os: windows-latest
            name: windows
            files: desktop/dist/*-Setup-*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3  # publishes no major-version tag
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"

      # bundle, smoke test (converts a generated drum loop), installer
      - name: Build
        working-directory: desktop
        run: |
          npm ci
          npm run dist

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Both jobs get here; whichever comes first creates the release.
          gh release create "$GITHUB_REF_NAME" --title "Trackyard $GITHUB_REF_NAME" --generate-notes 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" ${{ matrix.files }} --clobber

      - name: Keep a test build
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v7
        with:
          name: trackyard-${{ matrix.name }}
          path: ${{ matrix.files }}
          retention-days: 3
